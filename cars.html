<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Self drive cars on rent | Revv</title>
    <link rel="stylesheet" href="./styles/cars.css" />
    <link rel="stylesheet" href="./styles/navbar.css" />
    <link rel="stylesheet" href="./styles/footer.css" />
    <link
      rel="stylesheet"
      href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
      integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div id="fi">
    <div class="container22"></div>
   
      <!-- <div id="navbar"> -->
        <!-- navbar -->
      <!-- </div> -->
      
      <div id="modify_div">
        <div>
          <div id="first_div">
            <div>
              <i class="fas fa-map-marker-alt" id="location_ICON"></i>
            </div>
            <div>
              <h3 class="city_location"></h3>
            </div>
          </div>
          <div>
            <p id="start_date126"></p>
          </div>
          <div>
            <p id="end_date126"></p>
          </div>
          <div id="last_div126">
            <a href="./index.html"
              ><button id="modi_btn">Modify Search</button></a
            >
          </div>
        </div>
      </div>
    </div>
      
      <div id="fix">
      
        <div id="filters_main_bx">
          <div id="filters_inner_bx">
            <div>
              <p>FILTERS</p>
            </div>
            <div>
              <p>
                Cars Rental in <b><span class="city"></span></b>
              </p>
            </div>
            <div>
              <label class="switch">
                <input type="checkbox" id="toggle" />
                <span class="slider round"></span>
              </label>
              <div>
                <p>
                  Prices <b><span id="exclude">exclude</span> </b> fuel cost
                </p>
              </div>
            </div>
            <div>
              <div>
                <p>Sort by:</p>
              </div>
              <div>
                <select name="" id="select_126" size="1px">
                  <option value="Popularity">Popularity</option>
                  <option value="Low to High">Price:Low to High</option>
                  <option value="High to Low">Price:High to Low</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div id="main">
          <div id="left">
            <span
              ><p><b>Segment</b></p></span
            >
            <input type="checkbox" id="hatchback" value="Hatchback" />
            <label for="hatchback">Hatchback</label><br />
            <input type="checkbox" id="sedan" value="Sedan" />
            <label for="sedan">Sedan</label><br />
            <input type="checkbox" id="suv" value="SUV" />
            <label for="suv">SUV</label><br />
            <input type="checkbox" id="muv" value="MUV" />
            <label for="muv">MUV</label><br />

            <!-- BRAND -->
            <p>
              <span><b>Brand</b></span>
            </p>
            <input type="checkbox" id="maruti" value="Maruti" />
            <label for="maruti">Maruti</label><br />
            <input type="checkbox" id="hyundai" value="Hyundai" />
            <label for="hyundai">Hyundai</label><br />
            <input type="checkbox" id="mahindra" value="Mahindra" />
            <label for="mahindra">Mahindra</label><br />
            <input type="checkbox" id="honda" value="Honda" />
            <label for="honda">Honda</label><br />
            <input type="checkbox" id="toyota" value="Toyota" />
            <label for="toyota">Toyota</label><br />

            <!-- fule type -->

            <p>
              <span><b>Fuel Type</b></span>
            </p>
            <input type="checkbox" id="diesel" value="Diesel" />
            <label for="diesel">Diesel</label><br />
            <input type="checkbox" id="petrol" value="Petrol" />
            <label for="petrol">Petrol</label><br />

            <!-- Transmission -->
            <p>
              <span><b>Transmission Type</b></span>
            </p>
            <input type="checkbox" id="automatic" value="Automatic" />
            <label for="automatic">Automatic</label><br />
            <input type="checkbox" id="manual" value="Manual" />
            <label for="manual">Manual</label><br />

            <!-- Capacity -->

            <p>
              <span><b>Seating Capacity</b></span>
            </p>
            <input type="checkbox" id="seats5" value="5" />
            <label for="seats5">5 Seat</label><br />
            <input type="checkbox" id="seats7" value="7" />
            <label for="seats7">7 Seat</label><br />
          </div>
          <div id="right"></div>
        </div>
        <div class="container23"></div>
      </div>
    
    <!-- <div></div> -->
  </div>
  </body>
</html>
<script type="module">
  import cars from "./js/cars-data.js";
  import navbar from "./component/navbar.js";
  import footer from "./component/footer.js";

  document.querySelector(".container22").innerHTML = navbar();
  document.querySelector(".container23").innerHTML = footer();

  // Reaching this page without picking a city and dates leaves us with nothing
  // to show in the search bar, so send the user back to do that first. The
  // redirect doesn't halt this script, hence the placeholder to read from.
  const saved = JSON.parse(localStorage.getItem("bookingdata") || "null");
  if (!saved) {
    window.location.replace("./index.html");
  }
  const booking = saved || { cityname: "", startdate: "", enddate: "" };

  const formatDate = (value) => {
    const date = new Date(value);
    if (isNaN(date)) return value || "--";
    return date.toLocaleDateString("en-IN", {
      weekday: "short",
      day: "numeric",
      month: "short",
    });
  };

  document.querySelector(".city").textContent = booking.cityname;
  document.querySelector(".city_location").textContent = booking.cityname;
  document.querySelector("#start_date126").textContent =
    `Start Date:- ${formatDate(booking.startdate)}`;
  document.querySelector("#end_date126").textContent =
    `End Date:- ${formatDate(booking.enddate)}`;

  // Each group ORs its own checked boxes together; the groups are then ANDed,
  // so ticking "SUV" and "Diesel" narrows to diesel SUVs instead of one
  // replacing the other.
  const FILTER_GROUPS = [
    { key: "segment", ids: ["hatchback", "sedan", "suv", "muv"] },
    { key: "brand", ids: ["maruti", "hyundai", "mahindra", "honda", "toyota"] },
    { key: "fuel", ids: ["diesel", "petrol"] },
    { key: "transmission", ids: ["automatic", "manual"] },
    { key: "seats", ids: ["seats5", "seats7"] },
  ];

  const right = document.querySelector("#right");
  const sortSelect = document.querySelector("#select_126");
  const fuelToggle = document.querySelector("#toggle");

  function selectedValues(group) {
    return group.ids
      .map((id) => document.querySelector(`#${id}`))
      .filter((box) => box && box.checked)
      .map((box) => box.value);
  }

  function visibleCars() {
    const filtered = cars.filter((car) =>
      FILTER_GROUPS.every((group) => {
        const chosen = selectedValues(group);
        return chosen.length === 0 || chosen.includes(String(car[group.key]));
      })
    );

    const order = sortSelect.value;
    if (order === "Low to High") {
      return [...filtered].sort((a, b) => a.price - b.price);
    }
    if (order === "High to Low") {
      return [...filtered].sort((a, b) => b.price - a.price);
    }
    return filtered; // "Popularity" keeps the catalogue's own order
  }

  // The three plans are fixed fractions of the daily rate rather than
  // Math.random(), which used to hand a car a different price on every render.
  const planPrice = (base, factor) => Math.round((base * factor) / 10) * 10;

  const rupees = (amount) => `₹ ${amount.toLocaleString("en-IN")}`;

  function priceBlock(amount, distance) {
    const wrapper = document.createElement("div");
    const price = document.createElement("h4");
    price.textContent = rupees(amount);
    const label = document.createElement("p");
    label.textContent = distance;
    wrapper.append(price, label);
    return wrapper;
  }

  function specBlock(iconSrc, text) {
    const wrapper = document.createElement("div");
    const icon = document.createElement("img");
    icon.src = iconSrc;
    icon.alt = "";
    const label = document.createElement("p");
    label.textContent = text;
    wrapper.append(icon, label);
    return wrapper;
  }

  const ICONS = {
    transmission:
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRv-2zbPaA--6Wv9GP0MEdHjVz845nXzR4Cw&usqp=CAU",
    fuel: "https://static.thenounproject.com/png/43344-200.png",
    seat: "https://static.thenounproject.com/png/1694451-200.png",
  };

  function carCard(car) {
    const box = document.createElement("div");
    box.setAttribute("class", "boxes126");

    const name = document.createElement("h3");
    name.textContent = car.name;

    const image = document.createElement("img");
    image.setAttribute("class", "car_img126");
    image.src = car.url;
    image.alt = car.name;
    image.loading = "lazy";

    const specs = document.createElement("div");
    specs.setAttribute("class", "small_row1");
    specs.append(
      specBlock(ICONS.transmission, car.transmission),
      specBlock(ICONS.fuel, car.fuel),
      specBlock(ICONS.seat, `${car.seats} seats`)
    );

    const prices = document.createElement("div");
    prices.setAttribute("class", "small_row2");
    prices.append(
      priceBlock(planPrice(car.price, 0.55), "132 kms"),
      priceBlock(planPrice(car.price, 0.78), "242 kms"),
      priceBlock(car.price, "440 kms")
    );

    const footerRow = document.createElement("div");
    footerRow.setAttribute("class", "small_row3");

    const extraKm = document.createElement("div");
    const extraKmText = document.createElement("p");
    extraKmText.textContent = "Extra km charge @ ₹ 8/km";
    extraKm.append(extraKmText);

    const buttonWrap = document.createElement("div");
    const book = document.createElement("button");
    book.textContent = "Book";
    book.style.fontWeight = "Bold";
    book.addEventListener("click", () => {
      // Save before navigating — the old order raced the page unload and could
      // land on the details page with no car selected.
      localStorage.setItem("car_details", JSON.stringify(car));
      window.location.href = "./details.html";
    });
    buttonWrap.append(book);

    footerRow.append(extraKm, buttonWrap);
    box.append(name, image, specs, prices, footerRow);
    return box;
  }

  function render() {
    const list = visibleCars();
    right.innerHTML = ""; // wipe first, or filtering appends a second copy

    if (list.length === 0) {
      const empty = document.createElement("p");
      empty.setAttribute("class", "no_results126");
      empty.textContent = "No cars match these filters. Try clearing a few.";
      right.append(empty);
      return;
    }

    list.forEach((car) => right.append(carCard(car)));
  }

  FILTER_GROUPS.flatMap((group) => group.ids).forEach((id) => {
    const box = document.querySelector(`#${id}`);
    if (box) box.addEventListener("change", render);
  });
  sortSelect.addEventListener("change", render);

  fuelToggle.addEventListener("change", () => {
    document.querySelector("#exclude").textContent = fuelToggle.checked
      ? "include"
      : "exclude";
  });

  render();
</script>
