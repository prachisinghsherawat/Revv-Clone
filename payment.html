<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Revv</title>

    <!-- Was a personal Font Awesome kit script whose domain allow-list rejected
         this origin, erroring on every load. The stylesheet the other pages use
         supplies the same icons. -->
    <link
      rel="stylesheet"
      href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
      integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles/checkout.css" />
    <link rel="stylesheet" href="./styles/navbar.css" />
    <link rel="stylesheet" href="./styles/footer.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <div class="heading">
      <p>Checkout</p>
    </div>

    <div class="container">
      <div id="paypay">
        <h2>Payment</h2>
        <h2>Amount ₹<span id="payam"></span></h2>
      </div>
      <form method="post">
        <h4>Account Details</h4>

        <div class="input-group">
          <div class="input-box">
            <input type="text" placeholder="First Name" required class="name" />
            <i class="fa fa-user icon"></i>
          </div>
          <div class="input-box">
            <input type="text" placeholder="Last Name" required class="name" />
            <i class="fa fa-user icon"></i>
          </div>
        </div>

        <div class="input-group">
          <div class="input-box">
            <input
              type="email"
              placeholder="Email Address"
              required
              class="name"
            />
            <i class="fa fa-envelope icon"></i>
          </div>
        </div>

        <div class="input-group">
          <div class="input-box">
            <h4>Date of Birth</h4>
            <input type="date" class="dob" />
          </div>
          <div class="input-box">
            <h4>Gender</h4>
            <input type="radio" id="b1" name="gender" checked class="radio" />
            <label for="b1"> <i class="fas fa-male"></i> Male</label>
            <input type="radio" id="b2" name="gender" class="radio" />
            <label for="b2"> <i class="fas fa-female"></i> Female</label>
          </div>
        </div>

        <div class="input-group">
          <div class="input-box">
            <h4>Payment Details</h4>
            <input
              type="radio"
              name="pay"
              id="bc1"
              checked
              class="radio"
              size="16"
            />
            <label for="bc1"
              ><span> <i class="fa fa-cc-visa"></i> Credit Card</span></label
            >

            <input type="radio" name="pay" id="bc2" class="radio" />
            <label for="bc2"
              ><span><i class="fa fa-cc-paypal"></i> Paypal</span></label
            >
          </div>
        </div>

        <div class="input-group">
          <div class="input-box">
            <input
              type="number"
              placeholder="Card Number"
              required
              class="name"
              id="cc"
            />
            <i class="fa fa-credit-card icon"></i>
          </div>
        </div>

        <div class="input-group">
          <div class="input-box">
            <input
              type="number"
              placeholder="Card CVV"
              required
              class="name"
              id="cvv"
            />
            <i class="fas fa-credit-card icon"></i>
          </div>
          <div class="input-box">
            <select id="expMonth" aria-label="Expiry month">
              <option value="">MM</option>
              <option value="01">01</option>
              <option value="02">02</option>
              <option value="03">03</option>
              <option value="04">04</option>
              <option value="05">05</option>
              <option value="06">06</option>
              <option value="07">07</option>
              <option value="08">08</option>
              <option value="09">09</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
            </select>

            <select id="expYear" aria-label="Expiry year">
              <option value="">YY</option>
              <option value="26">26</option>
              <option value="27">27</option>
              <option value="28">28</option>
              <option value="29">29</option>
              <option value="30">30</option>
              <option value="31">31</option>
              <option value="32">32</option>
              <option value="33">33</option>
              <option value="34">34</option>
              <option value="35">35</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <div class="input-box">
            <button id="pay" type="submit">
              PAY NOW ₹<span id="paybtnam"></span>
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="container otpDiv">
      <div class="input-group">
        <div class="input-box">
          <input
            type="number"
            placeholder="Enter Otp"
            required
            class="name"
            id="otp"
          />
          <i class="fa fa-sms icon"></i>
        </div>
        <button id="otpButton" type="submit">Submit</button>
      </div>
    </div>
    <div id="footer"></div>

    <script type="module">
      import navbar from "./component/navbar.js";
      import footer from "./component/footer.js";

      document.getElementById("navbar").innerHTML = navbar();
      document.getElementById("footer").innerHTML = footer();

      // No amount means the user never came through the booking flow.
      const total = JSON.parse(localStorage.getItem("totalPrice") || "null");
      if (total === null) {
        window.location.replace("./index.html");
      }

      const amount = Number(total || 0).toLocaleString("en-IN");
      document.getElementById("payam").textContent = amount;
      document.getElementById("paybtnam").textContent = amount;
    </script>
    <script src="./js/checkout.js"></script>
  </body>
</html>
